server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gsy-ai-demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.19.176.1:3306/gsy_ai_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志
logging:
  level:
    root: info
    com.gsy: debug

# 自定义配置
gsy:
  file:
    upload-path: D:/AiFile/file
    temporary-path: D:/AiFile/temporaryFile

  rag:
    chunk:
      max-length: 800
      overlap: 100

    embedding:
      provider: dashscope
      model: text-embedding-v3
      api-key: sk-cad1be71e0274f8cae49c0e2cf124c36   # 你原来硬编码的key，先移到这里
      url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings

    llm:
      url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      model: deepseek-v4-flash
