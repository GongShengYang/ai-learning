server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gsy-ai-demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    mcp:
      server:
        name: ai-dome-mcp-server
        version: 1.0.0
        # 用于生成 MCP 消息回调地址，必须包含 Spring 的 /api 上下文路径。
        base-url: http://localhost:8080/api
    openai:
      api-key: ${gsy.rag.llm.api-key}
      # base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode
      base-url: https://dashscope.aliyuncs.com/compatible-mode

      chat:
        options:
          # model: qwen3.8-max
          model: deepseek-v4-flash

      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${gsy.rag.embedding.api-key}
        options:
          model: text-embedding-v3


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.2.150:3306/gsy_ai_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志
logging:
  level:
    root: info
    com.gsy: debug
    org.springframework.ai.chat.client: DEBUG
    org.springframework.ai.openai: TRACE
    org.springframework.web.client: TRACE
    org.springframework.web.client.RestClient: TRACE
    org.springframework.web.client.DefaultRestClient: TRACE
    org.springframework.http.client: TRACE



# 自定义配置
gsy:
  workflow:
    timeout:
      # 会话创建、历史读取和消息保存都是数据库操作，最多等待3秒。
      memory-ms: 3000
      # 意图分类需要调用模型，最多等待30秒。
      intent-classification-ms: 30000
      # Java路由只是内存判断，正常应在1秒内完成。
      route-decision-ms: 1000
      # 知识检索和模型回答链路较长，最多等待60秒。
      route-execution-ms: 60000
  mcp:
    # MCP 服务根地址；具体 SSE 地址由客户端拼接为 /api/sse。
    server-url: http://localhost:8080
  file:
    upload-path: D:/AiFile/file
    temporary-path: D:/AiFile/temporaryFile

  rag:
    chunk:
      max-length: 800
      overlap: 100

    embedding:
      api-key: ${DASHSCOPE_API_KEY}

    llm:
      #api-key: ${WXZY_API_KEY}
      api-key: ${DASHSCOPE_API_KEY}
      #api-key: ${DASHSCOPE_API_KEY}
      # 最大上下文长度（字符）
      max-context-length: 6000

    retrieval:
      min-score: 0.55

  milvus:
    uri: http://localhost:19530
