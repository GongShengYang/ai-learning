server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gsy-ai-demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    openai:
      api-key: ${gsy.rag.llm.api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode

      chat:
        options:
          model: deepseek-v4-flash

      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${gsy.rag.embedding.api-key}
        options:
          model: text-embedding-v3


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.2.150:3306/gsy_ai_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志
logging:
  level:
    root: info
    com.gsy: debug
    org.springframework.ai.chat.client: DEBUG
    org.springframework.ai.openai: TRACE
    org.springframework.web.client: TRACE
    org.springframework.web.client.RestClient: TRACE
    org.springframework.web.client.DefaultRestClient: TRACE
    org.springframework.http.client: TRACE



# 自定义配置
gsy:
  file:
    upload-path: D:/AiFile/file
    temporary-path: D:/AiFile/temporaryFile

  rag:
    chunk:
      max-length: 800
      overlap: 100

    embedding:
      api-key: ${DASHSCOPE_API_KEY}

    llm:
      api-key: ${DASHSCOPE_API_KEY}
      # 最大上下文长度（字符）
      max-context-length: 6000

    retrieval:
      min-score: 0.55

  milvus:
    uri: http://localhost:19530